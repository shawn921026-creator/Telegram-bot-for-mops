name: premarket

on:
  schedule:
    # GitHub 排程常延遲 30–60 分（甚至跳過），所以台北 07:20 就觸發（UTC 前一天 23:20，週日～週四），
    # 程式抓完資料會等到 08:30 才發；晚到就抓完立刻發
    - cron: "20 23 * * 0-4"
  workflow_dispatch:

concurrency:
  group: premarket
  cancel-in-progress: false

permissions:
  contents: write                   # 把櫃買處置紀錄寫回 repo

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      TZ: Asia/Taipei
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet yfinance
      - run: python3 premarket.py
      - name: Save state
        if: always()
        run: |
          git config user.name "mops-bot"
          git config user.email "mops-bot@users.noreply.github.com"
          git add premarket_state.json holidays.json
          git diff --cached --quiet || (git commit -q -m "premarket state" && git pull -q --rebase && git push -q)
