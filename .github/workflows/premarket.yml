name: premarket

on:
  schedule:
    - cron: "5 0 * * 1-5"           # 台北 08:05 觸發，程式會等到 08:30 才發（GitHub cron 常延遲）
  workflow_dispatch:

concurrency:
  group: premarket
  cancel-in-progress: false

permissions:
  contents: write                   # 把櫃買處置紀錄寫回 repo

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      TZ: Asia/Taipei
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet yfinance
      - run: python3 premarket.py
      - name: Save state
        if: always()
        run: |
          git config user.name "mops-bot"
          git config user.email "mops-bot@users.noreply.github.com"
          git add premarket_state.json
          git diff --cached --quiet || (git commit -q -m "premarket state" && git pull -q --rebase && git push -q)
